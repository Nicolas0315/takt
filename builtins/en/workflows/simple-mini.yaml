name: simple-mini
description: A lightweight development workflow for capable models. It omits dedicated test writing and delegates review and verified remediation to the shared peer-review flow.
capabilities: [readonly, enable-skills]
max_steps: 20
initial_step: plan
steps:
  - name: plan
    capabilities: [readonly, enable-skills]
    uses: development-core-plan
    with:
      plan_policy: [design-planning]
      plan_knowledge: [architecture]
      plan_instruction: simple-plan
      plan_report_format: plan
    rules:
      - condition: Requirements are clear and implementation is feasible
        next: implement
      - condition: The user is asking a question rather than requesting implementation
        next: COMPLETE
      - condition: Requirements are unclear or information is insufficient
        next: ABORT
        appendix: |
          Questions:
          - {Question 1}
          - {Question 2}

  - name: replan
    uses: development-core-replan
    with:
      plan_policy: [design-planning]
      plan_knowledge: [architecture]
      replan_instruction: replan-implementation
    rules:
      - condition: An actionable, untried project-scoped change or investigation and its verification steps were defined
        next: implement
      - condition: The current implementation satisfies the requirements and acceptance criteria, required project-scoped verification is complete, and no untried change or investigation remains
        next: peer-review
      - condition: Confirmed evidence shows that project-scoped changes or investigation cannot resolve the blocker, leaving only an external action or mutually incompatible requirements
        next: ABORT

  - name: implement
    kind: workflow_call
    call: development-implement
    args:
      development_policy: [coding, testing]
      development_knowledge: [architecture]
      implementation_instruction: simple-implement
    rules:
      - condition: COMPLETE
        next: peer-review
      - condition: need_replan
        next: replan
      - condition: ABORT
        next: ABORT

  - name: peer-review
    kind: workflow_call
    call: peer-review
    args:
      reviewer_suite: peer-review-suite-simple
      review_policy_additions: [testing]
      review_knowledge_additions: [architecture, unit-testing, e2e-testing]
      fix_companions: []
      remediation_workflow: development-remediation
      fix_pool: coding-facets
      plan_policy: [coding, testing, review]
      fix_policy: [coding, testing]
      fix_knowledge: [architecture]
      verification_knowledge: [architecture, unit-testing, e2e-testing]
      verification_policy: [coding, testing, review]
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: need_replan
        next: replan
      - condition: ABORT
        next: ABORT
