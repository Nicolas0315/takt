name: simple-frontend
description: A development workflow for capable models that injects frontend knowledge and policies into the shared development core.
max_steps: 30
initial_step: develop
steps:
  - name: develop
    kind: workflow_call
    call: development-core
    args:
      reviewer_suite: peer-review-suite-simple
      review_policy_additions: [testing, design-fidelity]
      plan_policy:
        - design-planning
      plan_knowledge:
        - frontend
        - react
        - security
        - architecture
      testing_policy:
        - coding
        - testing
      development_policy:
        - coding
        - testing
        - design-fidelity
      review_policy:
        - review
        - coding
        - testing
        - design-fidelity
      development_knowledge:
        - frontend
        - react
        - security
        - architecture
      testing_knowledge:
        - frontend
        - react
        - architecture
        - unit-testing
        - e2e-testing
      review_knowledge:
        - frontend
        - react
        - security
        - architecture
        - unit-testing
        - e2e-testing
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: ABORT
        next: ABORT
