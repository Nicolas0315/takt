name: simple-cqrs
description: A development workflow for capable models that injects backend and CQRS+ES knowledge and policies into the shared development core.
max_steps: 30
initial_step: develop
steps:
  - name: develop
    kind: workflow_call
    call: development-core
    args:
      reviewer_suite: peer-review-suite-simple
      review_policy_additions: [testing]
      plan_instruction: simple-plan
      replan_instruction: replan-implementation
      testing_instruction: simple-write-tests-first
      implementation_instruction: simple-implement-after-tests
      plan_policy:
        - design-planning
      plan_knowledge:
        - backend
        - cqrs-es
        - security
        - architecture
      testing_policy:
        - coding
        - testing
      development_policy:
        - coding
        - testing
      review_policy:
        - review
        - coding
        - testing
      development_knowledge:
        - backend
        - cqrs-es
        - security
        - architecture
      testing_knowledge:
        - backend
        - cqrs-es
        - architecture
        - unit-testing
        - e2e-testing
      review_knowledge:
        - backend
        - cqrs-es
        - security
        - architecture
        - unit-testing
        - e2e-testing
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: ABORT
        next: ABORT
