name: default
description: 動的実装ファセット、AI アンチパターン Companion と Moderator、共通ピアレビューを使う既定開発ワークフロー。
max_steps: 51
initial_step: develop
steps:
  - name: develop
    kind: workflow_call
    call: development-core
    args:
      implementation_pool: coding-facets
      plan_policy: [design-planning]
      plan_knowledge: [architecture, task-decomposition]
      implementation_workflow: development-implement-dynamic
      remediation_workflow: development-remediation-dynamic
      implementation_companions:
        fixed: [ai-antipattern-review-companion]
        pool: []
        moderator: ai-antipattern-review-moderator
      reviewer_suite: default-development-review-adapter
      review_policy_additions: []
      testing_policy: [coding, testing]
      testing_knowledge: [architecture, unit-testing, e2e-testing]
      development_policy: [coding, testing, ai-antipattern]
      development_knowledge: [architecture, implementation-semantics]
      implementation_instruction: implement
      review_policy: [coding, testing, review]
      review_knowledge: [architecture, unit-testing, e2e-testing]
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: ABORT
        next: ABORT
