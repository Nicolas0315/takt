name: review-frontend
description: フロントエンド特化5+2の2段階レビュー（構造・コンポーネント・テスト・AI・堅牢性 → セキュリティ・コーディング）
workflow_config:
  provider_options:
    codex:
      network_access: true
    opencode:
      network_access: true
max_steps: 10
initial_step: gather

steps:
  - name: gather
    tags:
      - plan
    edit: false
    persona: planner
    provider_options:
      claude:
        allowed_tools:
          - Read
          - Glob
          - Grep
          - Bash
          - WebSearch
          - WebFetch
    instruction: gather-review
    output_contracts:
      report:
        - name: review-target.md
          format: review-gather
    rules:
      - condition: レビュー対象の情報収集完了
        next: reviewers_1
      - condition: レビュー対象を特定できない、情報不足
        next: ABORT

  - name: reviewers_1
    tags:
      - review
    parallel:
      - name: arch-review
        tags:
          - review
        edit: false
        persona: architecture-reviewer
        policy: review
        knowledge:
          - architecture
          - contract-lifecycle
          - frontend
        provider_options:
          claude:
            allowed_tools:
              - Read
              - Glob
              - Grep
              - WebSearch
              - WebFetch
        instruction: review-arch
        output_contracts:
          report:
            - name: architect-review.md
              format: architecture-review
        rules:
          - condition: approved
          - condition: needs_fix

      - name: frontend-review
        tags:
          - review
        edit: false
        persona: frontend-reviewer
        policy:
          - review
          - design-fidelity
        knowledge: frontend
        provider_options:
          claude:
            allowed_tools:
              - Read
              - Glob
              - Grep
              - WebSearch
              - WebFetch
        instruction: review-frontend
        output_contracts:
          report:
            - name: frontend-review.md
              format: frontend-review
        rules:
          - condition: approved
          - condition: needs_fix

      - name: testing-review
        tags:
          - review
        edit: false
        persona: testing-reviewer
        policy:
          - review
          - testing
        knowledge:
          - unit-testing
          - e2e-testing
        provider_options:
          claude:
            allowed_tools:
              - Read
              - Glob
              - Grep
              - Bash
              - WebSearch
              - WebFetch
        instruction: review-test
        output_contracts:
          report:
            - name: testing-review.md
              format: testing-review
        rules:
          - condition: approved
          - condition: needs_fix

      - name: ai-antipattern-review-2nd
        tags:
          - review
        edit: false
        persona: ai-antipattern-reviewer
        policy:
          - review
          - ai-antipattern
        provider_options:
          claude:
            allowed_tools:
              - Read
              - Glob
              - Grep
              - Bash
              - WebSearch
              - WebFetch
        instruction: ai-antipattern-review
        output_contracts:
          report:
            - name: ai-antipattern-review.md
              format: ai-antipattern-review
        rules:
          - condition: approved
          - condition: needs_fix

      - name: robustness-review
        tags:
          - review
        edit: false
        persona: robustness-reviewer
        policy: review
        knowledge: robustness
        provider_options:
          claude:
            allowed_tools:
              - Read
              - Glob
              - Grep
              - WebSearch
              - WebFetch
        instruction: review-robustness
        output_contracts:
          report:
            - name: robustness-review.md
              format: robustness-review
        rules:
          - condition: approved
          - condition: needs_fix

    rules:
      - condition: all("approved")
        next: reviewers_2
      - condition: any("needs_fix")
        next: supervise

  - name: reviewers_2
    tags:
      - review
    parallel:
      - name: security-review
        tags:
          - review
        edit: false
        persona: security-reviewer
        policy: review
        knowledge: security
        provider_options:
          claude:
            allowed_tools:
              - Read
              - Glob
              - Grep
              - WebSearch
              - WebFetch
        instruction: review-security
        output_contracts:
          report:
            - name: security-review.md
              format: security-review
        rules:
          - condition: approved
          - condition: needs_fix

      - name: coding-review
        tags:
          - review
        edit: false
        persona: coding-reviewer
        policy:
          - review
          - coding
        knowledge: implementation-semantics
        provider_options:
          claude:
            allowed_tools:
              - Read
              - Glob
              - Grep
              - Bash
              - WebSearch
              - WebFetch
        instruction: review-coding
        output_contracts:
          report:
            - name: coding-review.md
              format: coding-review
        rules:
          - condition: approved
          - condition: needs_fix

    rules:
      - condition: all("approved")
        next: merge-readiness-review
      - condition: any("needs_fix")
        next: supervise

  - name: merge-readiness-review
    tags:
      - review
      - final-gate
      - merge-readiness
    edit: false
    persona: merge-readiness-reviewer
    policy: review
    provider_options:
      claude:
        allowed_tools:
          - Read
          - Glob
          - Grep
          - Bash
          - WebSearch
          - WebFetch
    instruction: review-merge-readiness
    output_contracts:
      report:
        - name: merge-readiness-review.md
          format: merge-readiness-review
    rules:
      - condition: approved
        next: review-synthesis
      - condition: needs_fix
        next: review-synthesis

  - name: review-synthesis
    tags:
      - review
      - final-gate
      - supervise
    edit: false
    persona: supervisor
    policy: review
    provider_options: &review_synthesis_provider_options
      claude:
        allowed_tools:
          - Read
          - Glob
          - Grep
          - WebSearch
          - WebFetch
    pass_previous_response: false
    instruction: &review_synthesis_instruction supervise
    output_contracts: &review_synthesis_output_contracts
      report:
        - name: supervisor-validation.md
          format: supervisor-validation
        - name: summary.md
          format: supervisor-summary
          use_judge: false
    rules:
      - condition: BLOCKED
        next: ABORT
      - condition: approved
        next: COMPLETE

  - name: supervise
    tags:
      - review
      - supervise
    edit: false
    persona: supervisor
    policy: review
    provider_options: *review_synthesis_provider_options
    pass_previous_response: false
    instruction: *review_synthesis_instruction
    output_contracts: *review_synthesis_output_contracts
    rules:
      - condition: BLOCKED
        next: ABORT
      - condition: レビュー統合完了
        next: COMPLETE
