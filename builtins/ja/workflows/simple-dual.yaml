name: simple-dual
description: 強いモデルの判断力を信頼し、共有開発コアへフロントエンドとバックエンドのナレッジとポリシーを注入する開発ワークフロー。
max_steps: 30
initial_step: develop
steps:
  - name: develop
    kind: workflow_call
    call: development-core
    args:
      reviewer_suite: peer-review-suite-simple
      review_policy_additions: [testing, design-fidelity, screen-api]
      plan_policy:
        - design-planning
      plan_knowledge:
        - frontend
        - react
        - backend
        - security
        - architecture
      testing_policy:
        - coding
        - testing
      development_policy:
        - coding
        - testing
        - design-fidelity
        - screen-api
      review_policy:
        - review
        - coding
        - testing
        - design-fidelity
        - screen-api
      development_knowledge:
        - frontend
        - react
        - backend
        - security
        - architecture
      testing_knowledge:
        - frontend
        - react
        - backend
        - architecture
        - unit-testing
        - e2e-testing
      review_knowledge:
        - frontend
        - react
        - backend
        - security
        - architecture
        - unit-testing
        - e2e-testing
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: ABORT
        next: ABORT
