name: simple
description: 強いモデルの判断力を信頼し、共有開発コアへシンプル向けファセットを注入する開発ワークフロー。
max_steps: 30
initial_step: develop
steps:
  - name: develop
    kind: workflow_call
    call: development-core
    args:
      reviewer_suite: peer-review-suite-simple
      review_policy_additions: [testing]
      plan_policy: [design-planning]
      plan_knowledge: [architecture]
      plan_instruction: simple-plan
      replan_instruction: replan-implementation
      testing_instruction: simple-write-tests-first
      testing_policy: [coding, testing]
      testing_knowledge: [architecture, unit-testing, e2e-testing]
      development_policy: [coding, testing]
      development_knowledge: [architecture]
      implementation_instruction: simple-implement-after-tests
      review_policy: [coding, testing, review]
      review_knowledge: [architecture, unit-testing, e2e-testing]
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: ABORT
        next: ABORT
